{% extends 'events/base.html' %}

{% block content %}
<h1>Register for: {{ event.title }}</h1>
<p><strong>Date:</strong> {{ event.event_date }} | <strong>Location:</strong> {{ event.location }}</p>
<hr>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Complete Registration</button>
</form>
{% endblock %}
